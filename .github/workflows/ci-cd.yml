name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      NODE_ENV: test
      TZ: Europe/Rome
      DATABASE_URL: postgresql://sauta_ci:sauta_ci@localhost:5432/sauta_ci?schema=public
      SAUTA_UI_ARTIFACT_DIR: test-results/ui

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sauta_ci
          POSTGRES_PASSWORD: sauta_ci
          POSTGRES_DB: sauta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sauta_ci -d sauta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files for live credentials
        run: bash scripts/check-public-safety.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w backend

      - name: Build shared package
        run: npm run build -w shared

      - name: Test shared package with coverage
        run: npm test -w shared -- --coverage

      - name: Build backend package
        run: npm run build -w backend

      - name: Smoke compiled backend modules
        run: npm run smoke:compiled -w backend

      - name: Build frontend package
        run: npm run build -w frontend

      - name: Test backend package with coverage
        run: npm test -w backend -- --coverage

      - name: Install Playwright Chromium
        run: npm run playwright:install -w backend

      - name: Run backend E2E tests
        run: npm run test:e2e -w backend

      - name: Run browser UI tests
        run: npm run test:ui

      - name: Validate Prisma schema
        run: npm run db:validate -w backend

      - name: Prove clean migration deployment
        run: npm run db:deploy -w backend

      - name: Verify migration status
        run: npm run db:status -w backend

      - name: Check whitespace errors
        run: git diff --check

      - name: Upload coverage and UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}
          path: |
            shared/coverage/
            backend/coverage/
            backend/test-results/
          if-no-files-found: ignore
          retention-days: 14
