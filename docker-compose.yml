services:
  postgres:
    image: postgres:16-alpine
    container_name: sauta-pg
    environment:
      POSTGRES_USER: sauta
      POSTGRES_PASSWORD: sauta
      POSTGRES_DB: sauta
    ports:
      - "5432:5432"
    volumes:
      - sauta_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauta -d sauta"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sauta_pg_data:
